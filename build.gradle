plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.example.taskmanager'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

ext['lombok.version'] = '1.18.36'

dependencies {
	// Web & API
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	
	// Database
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.h2database:h2'
	
	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	
	// Lombok (reduce boilerplate - updated to 1.18.36 for Eclipse JDT / VS Code compatibility)
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'
	testCompileOnly 'org.projectlombok:lombok:1.18.36'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

	// Metadata for custom properties (app.*) so IDEs recognise them in application.yml
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'task-manager-api.jar'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = '0.8.12'
}

def coverageExclusions = [
	'**/TaskManagerApplication.class',
	'**/config/**',
	'**/dto/**',
	'**/exception/*Exception.class'
]

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExclusions)
	}))
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	classDirectories.setFrom(jacocoTestReport.classDirectories)
	violationRules {
		rule {
			element = 'CLASS'
			includes = ['com.example.taskmanager.service.validation.*']
			limit {
				counter = 'BRANCH'
				minimum = 0.90
			}
		}
		rule {
			element = 'CLASS'
			includes = ['com.example.taskmanager.service.impl.*']
			limit {
				counter = 'INSTRUCTION'
				minimum = 0.80
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

sonar {
	properties {
		property 'sonar.projectKey', 'JuanCOD001116_pruebasTesting'
		property 'sonar.organization', 'juancod001116'
		property 'sonar.host.url', 'https://sonarcloud.io'
		property 'sonar.projectName', 'Task Manager API'
		property 'sonar.java.source', '17'
		property 'sonar.coverage.jacoco.xmlReportPaths',
				"${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
		property 'sonar.coverage.exclusions',
				'**/TaskManagerApplication.java,**/config/**,**/dto/**,**/exception/*Exception.java'
		property 'sonar.qualitygate.wait', 'true'
	}
}

tasks.named('sonar') {
	dependsOn jacocoTestReport
}
